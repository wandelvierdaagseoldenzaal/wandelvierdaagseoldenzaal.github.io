<!-- start custom head snippets -->

{% if page.preview_home %}
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@700;800;900&family=Nunito+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
{% endif %}

{% if site.favicon %}
    <link rel="icon" type="image/x-icon" href="{{ site.favicon }}">
{% endif %}

{% if layout.enablecountdown == true %}
    <link rel="stylesheet" href="http://fonts.googleapis.com/css?family=Open+Sans+Condensed:300" />
    <link rel="stylesheet" href="assets/countdown/jquery.countdown.css" />
{% endif %}
<!-- end custom head snippets -->
